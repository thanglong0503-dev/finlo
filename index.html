<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finlo — Sắp ra mắt</title>
  <meta name="description" content="Finlo — nền tảng theo dõi và đầu tư đa lớp tài sản. Sắp ra mắt." />
  <style>
    :root { --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --accent: #16a34a; --line: #e2e8f0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --fg: #f1f5f9; --muted: #94a3b8; --line: #1e293b; } }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    .logo { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 40px; }
    .logo span { color: var(--accent); }
    h1 { font-size: clamp(32px, 7vw, 56px); line-height: 1.1; letter-spacing: -1px; margin-bottom: 16px; }
    p { color: var(--muted); font-size: 18px; max-width: 520px; margin: 0 auto 32px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .tags div { border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px; }
    footer { margin-top: 56px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">fin<span>lo</span></div>
    <h1>Lo trọn tài sản của bạn<br />trong một nơi</h1>
    <p>Chứng khoán, hàng hoá, kim loại quý và tài sản số. Finlo đang được xây dựng và sẽ sớm ra mắt.</p>
    <div class="tags">
      <div>📈 Chứng khoán</div>
      <div>🛢️ Hàng hoá</div>
      <div>🥇 Kim loại quý</div>
      <div>₿ Tài sản số</div>
    </div>
    <footer>© 2026 Finlo · finlo.id.vn</footer>
  </main>
</body>
</html>
